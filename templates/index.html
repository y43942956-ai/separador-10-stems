<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separador 10 Stems</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:white;text-align:center;padding:20px}
.card{background:#1c1c1c;padding:24px;border-radius:16px;max-width:480px;margin:30px auto}
button{background:#1DB954;color:white;border:0;padding:14px 24px;border-radius:30px;font-size:18px;width:100%;font-weight:bold}
input{margin:20px 0;width:100%}
.stems{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stems span{background:#333;padding:6px 12px;border-radius:20px;font-size:13px}
small{color:#aaa}
</style>
</head>
<body>
<h1>🎵 Separador 10 Stems</h1>
<p>Sube tu canción y te devuelve 10 pistas separadas en un ZIP</p>
<div class="card">
<div class="stems"><span>Vocals</span><span>Drums</span><span>Bass</span><span>Piano</span><span>Guitar</span><span>Other</span><span>Kick</span><span>Snare</span><span>HiHat</span><span>Toms</span></div>
<form method="post" enctype="multipart/form-data" action="/separate">
<input type="file" name="file" accept=".mp3,.wav,.flac,.m4a" required>
<button type="submit">🚀 Separar en 10 Stems</button>
</form>
<p><small>Puede tardar 2-5 minutos. No cierres la página.</small></p>
</div>
<p><small>Hecho con Demucs AI</small></p>
</body>
</html>
